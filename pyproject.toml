[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-vlm"
version = "0.1.0"
description = "FOCUS: closed-loop attention feedback and temporal gating for video VLMs"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [
    {name = "Akul Santhosh"},
    {name = "Aastha Jhunjhunwala"},
]
keywords = ["video", "vlm", "vision-language-model", "temporal-redundancy", "frame-gating"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
qwen = [
    "transformers==4.57.6",
    "accelerate>=0.25.0",
    "torchvision>=0.15.0",
]
gpu = [
    "pynvml>=11.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
]
all = [
    "focus-vlm[qwen,gpu,dev]",
]

[project.scripts]
focus-gate = "focus.video.processing:focus_gate_cli"
focus-video = "focus.video.processing:focus_video_cli"
focus-benchmark = "focus.evaluation:main"
focus-egoschema = "focus.egoschema:main"

[project.urls]
Homepage = "https://akul-nv.github.io/focus/"
Repository = "https://github.com/akul-nv/focus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
